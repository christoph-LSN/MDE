name: Statistische Auswertung

on:
  push:        # startet bei jeder Änderung, die gepusht wird
    branches:
      - master
  workflow_dispatch:   # ermöglicht manuelles Starten

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.8

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib

      - name: Run Auswertung
        run: python auswertung.py
        env:
          MDE_TOKEN: ${{ secrets.MDE_TOKEN }}

      - name: Commit Results
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@users.noreply.github.com"

          git add .
          git commit -m "Update results" || echo "No changes to commit"

          git push https://x-access-token:${{ secrets.MDE_TOKEN }}@github.com/${{ github.repository }}.git HEAD:master
